<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- Tanker truck - truck with cylindrical tank body -->
  <!-- Cab -->
  <path d="M6,30 L6,56 L42,56 L42,26 Q42,22 38,22 L10,22 Q6,22 6,26 Z"/>
  <!-- Windshield -->
  <path d="M10,26 L28,26 L28,44 L10,44 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="4" y="42" width="3" height="5" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="3" y="52" width="40" height="5" rx="2"/>
  <!-- Chassis -->
  <rect x="42" y="50" width="152" height="4" rx="1" fill="#1e293b"/>
  <!-- Tank body (elliptical/cylindrical) -->
  <ellipse cx="122" cy="34" rx="72" ry="18" fill="#334155"/>
  <!-- Tank body highlight -->
  <ellipse cx="122" cy="28" rx="65" ry="8" fill="#475569" opacity="0.3"/>
  <!-- Tank end cap (rear) -->
  <ellipse cx="194" cy="34" rx="2" ry="16" fill="#475569"/>
  <!-- Tank bands -->
  <rect x="78" y="16" width="2" height="36" rx="0.5" fill="#1e293b" opacity="0.5"/>
  <rect x="120" y="16" width="2" height="36" rx="0.5" fill="#1e293b" opacity="0.5"/>
  <rect x="162" y="16" width="2" height="36" rx="0.5" fill="#1e293b" opacity="0.5"/>
  <!-- Ladder/walkway on top -->
  <rect x="90" y="14" width="60" height="2" rx="0.5" fill="#1e293b"/>
  <!-- Tail light -->
  <rect x="194" y="46" width="3" height="4" rx="1" fill="#ef4444"/>
  <!-- Front axle wheel well -->
  <rect x="16" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear axle dual wheels -->
  <rect x="148" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <rect x="168" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheel -->
  <circle cx="26" cy="64" r="9" fill="#1e293b"/>
  <circle cx="26" cy="64" r="4.5" fill="#64748b"/>
  <!-- Rear wheels -->
  <circle cx="157" cy="64" r="9" fill="#1e293b"/>
  <circle cx="157" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="177" cy="64" r="9" fill="#1e293b"/>
  <circle cx="177" cy="64" r="4.5" fill="#64748b"/>
</svg>
