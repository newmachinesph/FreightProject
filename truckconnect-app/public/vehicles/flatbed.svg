<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- Flatbed trailer truck - long flat cargo platform, no walls -->
  <!-- Cab -->
  <path d="M6,30 L6,56 L42,56 L42,26 Q42,22 38,22 L10,22 Q6,22 6,26 Z"/>
  <!-- Windshield -->
  <path d="M10,26 L28,26 L28,44 L10,44 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="4" y="42" width="3" height="5" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="3" y="52" width="40" height="5" rx="2"/>
  <!-- Chassis frame -->
  <rect x="42" y="48" width="152" height="4" rx="1" fill="#1e293b"/>
  <!-- Flatbed platform -->
  <rect x="44" y="42" width="148" height="6" rx="1"/>
  <!-- Flatbed surface detail -->
  <line x1="60" y1="42" x2="60" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="80" y1="42" x2="80" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="100" y1="42" x2="100" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="120" y1="42" x2="120" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="140" y1="42" x2="140" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="160" y1="42" x2="160" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="180" y1="42" x2="180" y2="48" stroke="#1e293b" stroke-width="0.5"/>
  <!-- Front headboard -->
  <rect x="44" y="28" width="4" height="14" rx="1"/>
  <!-- Stake pockets -->
  <rect x="192" y="36" width="2" height="6" rx="0.5"/>
  <!-- Tail light -->
  <rect x="192" y="44" width="3" height="4" rx="1" fill="#ef4444"/>
  <!-- Front axle wheel well -->
  <rect x="16" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear axle dual wheels -->
  <rect x="148" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <rect x="168" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheel -->
  <circle cx="26" cy="64" r="9" fill="#1e293b"/>
  <circle cx="26" cy="64" r="4.5" fill="#64748b"/>
  <!-- Rear wheels -->
  <circle cx="157" cy="64" r="9" fill="#1e293b"/>
  <circle cx="157" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="177" cy="64" r="9" fill="#1e293b"/>
  <circle cx="177" cy="64" r="4.5" fill="#64748b"/>
</svg>
