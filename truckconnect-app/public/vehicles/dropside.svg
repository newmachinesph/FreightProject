<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- Dropside truck - truck with low side walls that can drop down -->
  <!-- Cab -->
  <path d="M10,28 L10,56 L50,56 L50,24 Q50,20 46,20 L14,20 Q10,20 10,24 Z"/>
  <!-- Windshield -->
  <path d="M14,24 L34,24 L34,42 L14,42 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="8" y="40" width="4" height="5" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="6" y="52" width="46" height="5" rx="2"/>
  <!-- Chassis frame -->
  <rect x="50" y="50" width="140" height="4" rx="1" fill="#1e293b"/>
  <!-- Flatbed floor -->
  <rect x="52" y="44" width="138" height="6" rx="1"/>
  <!-- Front headboard (tall) -->
  <rect x="52" y="18" width="4" height="26" rx="1"/>
  <!-- Dropside wall (low, with hinge detail at bottom) -->
  <rect x="58" y="32" width="130" height="12" rx="1" fill="#475569"/>
  <!-- Dropside hinge points -->
  <circle cx="62" cy="44" r="1.5" fill="#1e293b"/>
  <circle cx="90" cy="44" r="1.5" fill="#1e293b"/>
  <circle cx="123" cy="44" r="1.5" fill="#1e293b"/>
  <circle cx="156" cy="44" r="1.5" fill="#1e293b"/>
  <circle cx="184" cy="44" r="1.5" fill="#1e293b"/>
  <!-- Dropside latch points (top) -->
  <rect x="88" y="30" width="3" height="4" rx="0.5" fill="#1e293b"/>
  <rect x="153" y="30" width="3" height="4" rx="0.5" fill="#1e293b"/>
  <!-- Stake posts -->
  <rect x="58" y="24" width="2" height="8" rx="0.5"/>
  <rect x="90" y="24" width="2" height="8" rx="0.5"/>
  <rect x="122" y="24" width="2" height="8" rx="0.5"/>
  <rect x="154" y="24" width="2" height="8" rx="0.5"/>
  <rect x="186" y="24" width="2" height="8" rx="0.5"/>
  <!-- Tail light -->
  <rect x="190" y="38" width="3" height="4" rx="1" fill="#ef4444"/>
  <!-- Front wheel well -->
  <rect x="22" y="55" width="22" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear wheel wells -->
  <rect x="140" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <rect x="162" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheel -->
  <circle cx="33" cy="64" r="10" fill="#1e293b"/>
  <circle cx="33" cy="64" r="5" fill="#64748b"/>
  <!-- Rear wheels -->
  <circle cx="150" cy="64" r="9" fill="#1e293b"/>
  <circle cx="150" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="172" cy="64" r="9" fill="#1e293b"/>
  <circle cx="172" cy="64" r="4.5" fill="#64748b"/>
</svg>
