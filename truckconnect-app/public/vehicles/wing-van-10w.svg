<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- 10-wheeler wing van - large truck, 3 axles, wing doors open -->
  <!-- Cab -->
  <path d="M6,28 L6,56 L42,56 L42,24 Q42,20 38,20 L10,20 Q6,20 6,24 Z"/>
  <!-- Windshield -->
  <path d="M10,24 L28,24 L28,42 L10,42 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="4" y="40" width="3" height="5" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="3" y="52" width="40" height="5" rx="2"/>
  <!-- Cargo box bottom -->
  <rect x="44" y="34" width="150" height="22" rx="1"/>
  <!-- Cargo box top rail -->
  <rect x="44" y="10" width="150" height="4" rx="1"/>
  <!-- Wing door (open, angled up) -->
  <path d="M44,14 L44,10 L194,10 L194,14 L194,26 L190,26 L190,16 L48,16 L48,26 L44,26 Z" fill="#475569"/>
  <!-- Inside visible area -->
  <rect x="48" y="26" width="142" height="8" fill="#94a3b8" opacity="0.3"/>
  <!-- Cargo floor -->
  <rect x="44" y="54" width="150" height="4" rx="1" fill="#1e293b"/>
  <!-- Tail light -->
  <rect x="194" y="38" width="3" height="6" rx="1" fill="#ef4444"/>
  <!-- Front axle wheel well -->
  <rect x="16" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <!-- Second axle wheel well -->
  <rect x="44" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear axle - dual wheels -->
  <rect x="148" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <rect x="168" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheels (2 axles) -->
  <circle cx="26" cy="64" r="9" fill="#1e293b"/>
  <circle cx="26" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="54" cy="64" r="9" fill="#1e293b"/>
  <circle cx="54" cy="64" r="4.5" fill="#64748b"/>
  <!-- Rear wheels (dual axle - showing 3 visible) -->
  <circle cx="157" cy="64" r="9" fill="#1e293b"/>
  <circle cx="157" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="177" cy="64" r="9" fill="#1e293b"/>
  <circle cx="177" cy="64" r="4.5" fill="#64748b"/>
</svg>
