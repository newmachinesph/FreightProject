<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- Container truck 20ft - truck chassis with 20ft shipping container -->
  <!-- Cab -->
  <path d="M6,28 L6,56 L42,56 L42,24 Q42,20 38,20 L10,20 Q6,20 6,24 Z"/>
  <!-- Windshield -->
  <path d="M10,24 L28,24 L28,42 L10,42 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="4" y="40" width="3" height="5" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="3" y="52" width="40" height="5" rx="2"/>
  <!-- Chassis frame -->
  <rect x="42" y="50" width="130" height="4" rx="1" fill="#1e293b"/>
  <!-- Trailer coupling area -->
  <rect x="42" y="46" width="20" height="4" fill="#1e293b"/>
  <!-- 20ft Container -->
  <rect x="72" y="14" width="100" height="36" rx="1"/>
  <!-- Container corrugation lines -->
  <line x1="82" y1="14" x2="82" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="92" y1="14" x2="92" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="102" y1="14" x2="102" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="112" y1="14" x2="112" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="122" y1="14" x2="122" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="132" y1="14" x2="132" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="142" y1="14" x2="142" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="152" y1="14" x2="152" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <line x1="162" y1="14" x2="162" y2="50" stroke="#1e293b" stroke-width="0.4"/>
  <!-- Container top rail -->
  <rect x="72" y="14" width="100" height="3" rx="1" fill="#475569"/>
  <!-- Container door bars (rear) -->
  <rect x="170" y="18" width="2" height="28" rx="0.5" fill="#475569"/>
  <!-- Tail light -->
  <rect x="172" y="42" width="3" height="4" rx="1" fill="#ef4444"/>
  <!-- Front wheel well -->
  <rect x="16" y="55" width="20" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear wheel wells -->
  <rect x="130" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <rect x="150" y="55" width="18" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheel -->
  <circle cx="26" cy="64" r="9" fill="#1e293b"/>
  <circle cx="26" cy="64" r="4.5" fill="#64748b"/>
  <!-- Rear wheels -->
  <circle cx="139" cy="64" r="9" fill="#1e293b"/>
  <circle cx="139" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="159" cy="64" r="9" fill="#1e293b"/>
  <circle cx="159" cy="64" r="4.5" fill="#64748b"/>
</svg>
