<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- Medium cab-over truck (Isuzu Forward style) with cargo box, 6 wheels -->
  <!-- Cab -->
  <path d="M10,26 L10,56 L52,56 L52,22 Q52,18 48,18 L14,18 Q10,18 10,22 Z"/>
  <!-- Windshield -->
  <path d="M14,22 L36,22 L36,42 L14,42 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="8" y="40" width="4" height="5" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="6" y="52" width="48" height="5" rx="2"/>
  <!-- Cargo box -->
  <rect x="54" y="12" width="136" height="44" rx="2"/>
  <!-- Cargo box detail lines -->
  <line x1="54" y1="16" x2="190" y2="16" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="122" y1="16" x2="122" y2="56" stroke="#1e293b" stroke-width="0.5"/>
  <!-- Cargo floor -->
  <rect x="54" y="54" width="136" height="4" rx="1" fill="#1e293b"/>
  <!-- Tail light -->
  <rect x="190" y="38" width="4" height="6" rx="1" fill="#ef4444"/>
  <!-- Front wheel well -->
  <rect x="22" y="55" width="22" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear wheel wells (dual axle) -->
  <rect x="138" y="55" width="22" height="7" rx="4" fill="#1e293b"/>
  <rect x="162" y="55" width="22" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheel -->
  <circle cx="33" cy="64" r="10" fill="#1e293b"/>
  <circle cx="33" cy="64" r="5" fill="#64748b"/>
  <!-- Rear wheels (dual axle - 4 wheels, 2 visible) -->
  <circle cx="149" cy="64" r="10" fill="#1e293b"/>
  <circle cx="149" cy="64" r="5" fill="#64748b"/>
  <circle cx="173" cy="64" r="10" fill="#1e293b"/>
  <circle cx="173" cy="64" r="5" fill="#64748b"/>
</svg>
