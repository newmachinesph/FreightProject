<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="#334155">
  <!-- Container truck 40ft - longer truck chassis with 40ft container -->
  <!-- Cab -->
  <path d="M2,30 L2,56 L32,56 L32,26 Q32,22 28,22 L6,22 Q2,22 2,26 Z"/>
  <!-- Windshield -->
  <path d="M6,26 L22,26 L22,42 L6,42 Z" fill="#94a3b8"/>
  <!-- Headlight -->
  <rect x="0" y="42" width="3" height="4" rx="1" fill="#fbbf24"/>
  <!-- Bumper -->
  <rect x="0" y="52" width="33" height="5" rx="2"/>
  <!-- Chassis frame -->
  <rect x="32" y="50" width="166" height="4" rx="1" fill="#1e293b"/>
  <!-- Trailer coupling -->
  <rect x="32" y="46" width="14" height="4" fill="#1e293b"/>
  <!-- 40ft Container -->
  <rect x="46" y="12" width="150" height="38" rx="1"/>
  <!-- Container corrugation lines -->
  <line x1="56" y1="12" x2="56" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="66" y1="12" x2="66" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="76" y1="12" x2="76" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="86" y1="12" x2="86" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="96" y1="12" x2="96" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="106" y1="12" x2="106" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="116" y1="12" x2="116" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="126" y1="12" x2="126" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="136" y1="12" x2="136" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="146" y1="12" x2="146" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="156" y1="12" x2="156" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="166" y1="12" x2="166" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="176" y1="12" x2="176" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <line x1="186" y1="12" x2="186" y2="50" stroke="#1e293b" stroke-width="0.3"/>
  <!-- Container top rail -->
  <rect x="46" y="12" width="150" height="3" rx="1" fill="#475569"/>
  <!-- Container door bars (rear) -->
  <rect x="194" y="16" width="2" height="30" rx="0.5" fill="#475569"/>
  <!-- Tail light -->
  <rect x="196" y="42" width="3" height="4" rx="1" fill="#ef4444"/>
  <!-- Front wheel well -->
  <rect x="12" y="55" width="16" height="7" rx="4" fill="#1e293b"/>
  <!-- Rear wheel wells -->
  <rect x="156" y="55" width="16" height="7" rx="4" fill="#1e293b"/>
  <rect x="174" y="55" width="16" height="7" rx="4" fill="#1e293b"/>
  <!-- Front wheel -->
  <circle cx="20" cy="64" r="9" fill="#1e293b"/>
  <circle cx="20" cy="64" r="4.5" fill="#64748b"/>
  <!-- Rear wheels -->
  <circle cx="164" cy="64" r="9" fill="#1e293b"/>
  <circle cx="164" cy="64" r="4.5" fill="#64748b"/>
  <circle cx="182" cy="64" r="9" fill="#1e293b"/>
  <circle cx="182" cy="64" r="4.5" fill="#64748b"/>
</svg>
